epochs: 200
batch_size: 64
optimizer:
  name: "adam"
  lr: 1.e-4
  min_lr: 1.e-7
  warmup_epochs: 10
  weight_decay:
    start: 0.3
    end: 0.4
  layerwise_decay: 0.9
  patch_embed_lr_mult: 0.2
model:
  checkpoint: "dino/dino_vitbase16_pretrain/dino_vitbase16_pretrain_full_checkpoint.pth"
  backbone: "deit_base_patch16_224"
  patch_size: 16
  frozen_layers: 6
  frozen_epochs: 30
  drop_path_rate: 0.1
  output_size: 304
loss:
  label_smoothing: 0.0
